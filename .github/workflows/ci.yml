name: CI

on:
  push:
    branches-ignore: [data]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tools
        run: pip install -r scraper/requirements-dev.txt cryptography
      - name: Scraper unit tests
        working-directory: scraper
        run: python -m pytest -q
      - name: PHP lint
        run: find web/api -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Push backend end-to-end test
        run: python tests/push_e2e.py
      - name: JavaScript syntax
        run: for f in web/js/*.js web/sw.js; do node --check "$f"; done
